<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0a0c" />
    <title>Offline · Fleet UI</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #0a0a0c;
        --fg: #ecebe6;
        --muted: #8e8e94;
        --border: #26262b;
        --card: #101013;
        --primary: #34d399;
        --primary-fg: #04130c;
        --grid: rgba(255, 255, 255, 0.045);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #faf9f6;
          --fg: #15171a;
          --muted: #68686f;
          --border: #dedbd3;
          --card: #ffffff;
          --primary: #0f766e;
          --primary-fg: #ffffff;
          --grid: rgba(0, 0, 0, 0.05);
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          linear-gradient(to right, var(--grid) 1px, transparent 1px),
          linear-gradient(to bottom, var(--grid) 1px, transparent 1px),
          var(--bg);
        background-size: 32px 32px;
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 420px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: color-mix(in srgb, var(--card) 94%, transparent);
        padding: 32px;
        text-align: center;
        box-shadow: 0 30px 80px -40px rgba(0, 0, 0, 0.6);
      }
      .logo {
        width: 48px;
        height: 48px;
        margin: 0 auto 18px;
        display: grid;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #0b0f0d;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 9px;
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 22px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.65;
      }
      .actions {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-top: 24px;
        flex-wrap: wrap;
      }
      a.button, button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 34px;
        padding: 0 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      a.button.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--primary-fg);
      }
      a.button:hover, button:hover { filter: brightness(1.08); }
      .fine {
        margin-top: 22px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 10px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="30" height="30">
          <g stroke="#34d399" stroke-width="4" stroke-linecap="round">
            <path d="M18 20h28" />
            <path d="M18 32h13" />
            <path d="M18 44h28" />
          </g>
          <circle cx="46" cy="32" r="4.5" fill="#34d399" />
          <circle cx="31" cy="20" r="3" fill="#5eead4" />
          <circle cx="31" cy="44" r="3" fill="#5eead4" />
        </svg>
      </div>
      <span class="badge">offline shell</span>
      <h1>Fleet UI is offline</h1>
      <p>
        The app shell has no network right now. Prompts and transcripts need a live connection to the fleet Worker,
        so reconnect before sending anything.
      </p>
      <div class="actions">
        <a class="button primary" href="/">Try the workspace</a>
        <button type="button" onclick="location.reload()">Reload</button>
      </div>
      <p class="fine">No prompts are queued while offline.</p>
    </main>
  </body>
</html>
